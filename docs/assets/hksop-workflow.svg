<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">HKSOP 数据与工作流</title>
  <desc id="workflow-desc">独立元件包经注册与编译形成统一支持清单。项目工程 JSON 与清单共同输入光学协议引擎，核验后形成项目成果。设计、入库及交付由 skills 规范支撑。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#6c899c" stroke-width="1.4"/></marker>
  </defs>
  <rect x="1" y="1" width="1278" height="518" rx="18" fill="#f5f8fa" stroke="#e0e7ec"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="36" y="43" font-size="17" font-weight="600" letter-spacing="2" fill="#607585">ONE LIBRARY · REUSABLE PROJECTS</text>
    <g transform="translate(36 82)">
      <rect width="270" height="128" rx="15" fill="#ffffff" stroke="#d0dde5" stroke-width="1.5"/>
      <text x="22" y="30" font-size="14" letter-spacing="2" fill="#6a7f8e">01 / SOURCE</text>
      <text x="22" y="66" font-size="25" font-weight="650" fill="#183449">独立元件包</text>
      <text x="22" y="100" font-size="16" fill="#607585">package.json · records · assets</text>
    </g>
    <g transform="translate(350 82)">
      <rect width="270" height="128" rx="15" fill="#ffffff" stroke="#d0dde5" stroke-width="1.5"/>
      <text x="22" y="30" font-size="14" letter-spacing="2" fill="#6a7f8e">02 / COMPILE</text>
      <text x="22" y="66" font-size="25" font-weight="650" fill="#183449">注册与编译</text>
      <text x="22" y="100" font-size="16" fill="#607585">registry → catalog build</text>
    </g>
    <g transform="translate(664 82)">
      <rect width="270" height="128" rx="15" fill="#ffffff" stroke="#d0dde5" stroke-width="1.5"/>
      <text x="22" y="30" font-size="14" letter-spacing="2" fill="#6a7f8e">03 / CATALOG</text>
      <text x="22" y="66" font-size="25" font-weight="650" fill="#183449">统一支持清单</text>
      <text x="22" y="100" font-size="16" fill="#607585">catalog · entity / package indexes</text>
    </g>
    <g transform="translate(350 280)">
      <rect width="270" height="128" rx="15" fill="#ffffff" stroke="#d0dde5" stroke-width="1.5"/>
      <text x="22" y="30" font-size="14" letter-spacing="2" fill="#6a7f8e">04 / PROJECT</text>
      <text x="22" y="66" font-size="25" font-weight="650" fill="#183449">项目工程 JSON</text>
      <text x="22" y="100" font-size="16" fill="#607585">器件实例 · 位置 · 方向 · 设置</text>
    </g>
    <g transform="translate(664 280)">
      <rect width="270" height="128" rx="15" fill="#eaf4f4" stroke="#8dbab8" stroke-width="1.5"/>
      <text x="22" y="30" font-size="14" letter-spacing="2" fill="#6a7f8e">05 / ENGINE</text>
      <text x="22" y="66" font-size="25" font-weight="650" fill="#183449">光学协议引擎</text>
      <text x="22" y="100" font-size="16" fill="#607585">摆放 · 追迹 · 渲染 · CAD</text>
    </g>
    <g transform="translate(978 280)">
      <rect width="270" height="128" rx="15" fill="#ffffff" stroke="#d0dde5" stroke-width="1.5"/>
      <text x="22" y="30" font-size="14" letter-spacing="2" fill="#6a7f8e">06 / DELIVER</text>
      <text x="22" y="66" font-size="25" font-weight="650" fill="#183449">项目成果</text>
      <text x="22" y="100" font-size="16" fill="#607585">预览 · STEP · BOM · 按需交付</text>
    </g>
    <g fill="none" stroke="#6c899c" stroke-width="2" marker-end="url(#arrow)">
      <path d="M306 146H340"/>
      <path d="M620 146H654"/>
      <path d="M799 210V270"/>
      <path d="M620 344H654"/>
      <path d="M934 344H968"/>
    </g>
    <text x="817" y="247" font-size="16" fill="#607585">构建运行数据</text>
    <text x="1000" y="113" font-size="18" font-weight="600" fill="#318d8b">定义一次，跨项目复用</text>
    <text x="1000" y="147" font-size="16" fill="#607585">资产按内容去重</text>
    <text x="1000" y="177" font-size="16" fill="#607585">各项能力分别核验</text>
    <text x="58" y="322" font-size="20" font-weight="600" fill="#183449">规则与操作规范</text>
    <text x="58" y="354" font-size="16" fill="#607585">skills / 设计 · 入库</text>
    <text x="58" y="381" font-size="16" fill="#607585">加工包 · 客户包</text>
    <path d="M36 443H1248" stroke="#dbe4ea"/>
    <text x="36" y="483" font-size="18" fill="#607585">人工维护元件包与项目定义；编译器生成清单与运行数据；交付前按用途核验。</text>
  </g>
</svg>
