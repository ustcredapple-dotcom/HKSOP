<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">Universal posts, adapters and the 12.5 mm positioning module</title>
<desc id="desc">A conceptual side view separates device datum, effective adapter height and total post height. A dimensioned nominal plan of the H25 B6-R1 post base has a 35 by 35 millimetre outline and four mounting holes on a 25 by 25 millimetre square, at plus or minus 12.5 millimetres from its centre. Drawings are explanatory, not manufacturing instructions.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8b6b3b"/></marker></defs>
<rect width="1400" height="660" fill="#f4f2ec"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" fill="#17343e">
  <text x="44" y="50" font-size="17" letter-spacing="2" fill="#7a6b53">THE INTERFACE IS THE STANDARD</text>
  <text x="44" y="98" font-size="30" font-weight="600">One support system. Different optical devices.</text>
  <path d="M710 137V575" stroke="#cfcfc7"/>
  <text x="44" y="148" font-size="16" font-weight="600">SIDE VIEW / CONCEPT</text>
  <text x="759" y="148" font-size="16" font-weight="600">PLAN / H25 POST BASE, B6-R1</text>
  <path d="M49 513H652" stroke="#8a9796" stroke-width="3"/>
  <rect x="131" y="481" width="219" height="32" fill="#7f9aa1"/>
