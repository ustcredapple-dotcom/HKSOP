  <text x="759" y="600" font-size="16">Hole centres: (±12.5, ±12.5) mm</text>
  <text x="759" y="625" font-size="14" fill="#607278">35 × 35 mm base · Four Ø6.4 mm holes · Nominal dimensions</text>
  <text x="44" y="600" font-size="16">Device + adapter + post = a placeable kit</text>
