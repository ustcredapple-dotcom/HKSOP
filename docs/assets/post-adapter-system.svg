  <rect x="154" y="325" width="173" height="38" fill="#d8b585" stroke="#997c53" stroke-width="2"/>
  <rect x="197" y="211" width="86" height="114" rx="4" fill="#c6d8db" stroke="#47717d" stroke-width="2"/>
  <circle cx="240" cy="257" r="27" fill="#e6f0f1" stroke="#47717d" stroke-width="2"/>
  <path d="M74 257H625" stroke="#168366" stroke-width="2" stroke-dasharray="9 5"/>
  <circle cx="240" cy="257" r="5" fill="#168366"/>
  <text x="363" y="245" font-size="18" font-weight="600" fill="#168366">Actual optical datum</text>
  <text x="363" y="282" font-size="16">Device reference height</text>
  <text x="363" y="347" font-size="16">Effective adapter height</text>
  <text x="363" y="414" font-size="16">Total post height</text>
  <text x="363" y="439" font-size="14" fill="#607278">Includes the base</text>
  <text x="44" y="544" font-size="15" fill="#607278">Support plane = local Z reference</text>
  <path d="M90 257V513" stroke="#8b6b3b" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="72" y="390" transform="rotate(-90 72 390)" font-size="16" text-anchor="middle" fill="#8b6b3b">62.5 mm nominal axis target</text>
  <g fill="none" stroke="#aab5b3"><path d="M1036 171V480M850 325H1221" stroke-dasharray="5 5"/></g>
  <rect x="896" y="185" width="280" height="280" fill="#c6d8db" fill-opacity="0.55" stroke="#47717d" stroke-width="2"/>
  <circle cx="1036" cy="325" r="100" fill="none" stroke="#819c9f" stroke-width="1.5"/>
  <g fill="#f4f2ec" stroke="#47717d" stroke-width="2"><circle cx="936" cy="225" r="25.6"/><circle cx="1136" cy="225" r="25.6"/><circle cx="936" cy="425" r="25.6"/><circle cx="1136" cy="425" r="25.6"/></g>
