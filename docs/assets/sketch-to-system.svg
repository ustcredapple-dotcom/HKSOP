<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="248" viewBox="0 0 1400 248" role="img" aria-labelledby="title desc">
<title id="title">From hand sketch to a checked optical assembly</title><desc id="desc">A human and AI engineering workflow: interpret a sketch, define project JSON, check supported optics, rebuild hierarchical CAD, then prepare delivery. Review findings feed back into the component definitions and project.</desc>
<rect width="1400" height="248" fill="#f4f2ec"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><text x="40" y="72" fill="#9a7749" font-size="16">01</text><text x="40" y="112" fill="#17343e" font-size="25" font-weight="600">Sketch</text><text x="40" y="147" fill="#607278" font-size="16">Intent and constraints</text><path d="M253 106h31m-8-7 8 7-8 7" fill="none" stroke="#9a7749" stroke-width="2"/><text x="310" y="72" fill="#9a7749" font-size="16">02</text><text x="310" y="112" fill="#17343e" font-size="25" font-weight="600">Project JSON</text><text x="310" y="147" fill="#607278" font-size="16">Parts, positions, optics</text><path d="M523 106h31m-8-7 8 7-8 7" fill="none" stroke="#9a7749" stroke-width="2"/><text x="580" y="72" fill="#9a7749" font-size="16">03</text><text x="580" y="112" fill="#17343e" font-size="25" font-weight="600">Optical checks</text><text x="580" y="147" fill="#607278" font-size="16">Datums and propagation</text><path d="M793 106h31m-8-7 8 7-8 7" fill="none" stroke="#9a7749" stroke-width="2"/><text x="850" y="72" fill="#9a7749" font-size="16">04</text><text x="850" y="112" fill="#17343e" font-size="25" font-weight="600">3D assembly</text><text x="850" y="147" fill="#607278" font-size="16">Real CAD and clearances</text><path d="M1063 106h31m-8-7 8 7-8 7" fill="none" stroke="#9a7749" stroke-width="2"/><text x="1120" y="72" fill="#9a7749" font-size="16">05</text><text x="1120" y="112" fill="#17343e" font-size="25" font-weight="600">Delivery</text><text x="1120" y="147" fill="#607278" font-size="16">BOM, STEP, drawings</text>
<path d="M1290 174V198H310m10-7-10 7 10 7" fill="none" stroke="#8c9d9e" stroke-width="1.5"/>
<text x="800" y="230" fill="#607278" font-size="15" text-anchor="middle">Review → revise the project or component definition → check again</text></g></svg>
