<svg xmlns="http://www.w3.org/2000/svg" viewBox="-323 -144 656 288" width="656mm" height="288mm" role="img" aria-labelledby="laser-title laser-desc">
  <title id="laser-title">频准激光 FL-SF-308-0.1-CW 俯视图 · 左端主光口</title>
  <desc id="laser-desc">型号 FL-SF-308-0.1-CW；原厂手册尺寸已核对，报告中心波长308.366 nm、测试功率118 mW。主机壳 520×238 mm；含前端突出部及安装脚 543×261 mm。紫色十字为光口，箭头向左出光；光轴距主机壳上侧边 52 mm，距支承底面 135 mm。右端金色件为接头，不是光口。安装孔组及接头相对壳体的位置含按原图比例估读，仅供布局，不作加工图。</desc>
  <defs>
