    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8dd83"/><stop offset=".5" stop-color="#c99c30"/><stop offset="1" stop-color="#876a26"/></linearGradient>
    <g id="lid-screw"><circle r="2.5" fill="#9faab4" stroke="#36434e" stroke-width=".6"/><path d="M-1.2 0H1.2" stroke="#36434e" stroke-width=".7"/></g>
    <g id="mount-hole"><rect x="-3.2" y="-3.7" width="6.4" height="7.4" rx="3.2" fill="#fcfefd" stroke="#36434e" stroke-width=".7"/></g>
  </defs>
