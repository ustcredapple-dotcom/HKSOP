<title id="laser935-title">935 nm 激光输出腔 · FL-SF-935-0.2-CW · 俯视布局示意</title>
<desc id="laser935-desc">手册尺寸布局示意。已按用户要求去掉四个估读外夹脚，保留主壳、侧散热器、光纤输入和935主输出；没有源STEP，未声称删除真实CAD实体。主壳长275毫米，本体基准光高27毫米；用户需选支撑和压板、手调实际板面光高。名义出光参考对齐已有孔列，不是安装孔。</desc>
