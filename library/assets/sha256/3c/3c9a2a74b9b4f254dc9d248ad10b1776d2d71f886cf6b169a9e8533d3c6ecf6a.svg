<svg xmlns="http://www.w3.org/2000/svg" viewBox="-270 -132 568 312" width="568mm" height="312mm" role="img" aria-labelledby="laser399-title laser399-desc">
<title id="laser399-title">399 nm 激光器 · 频准激光 · 俯视图</title>
<desc id="laser399-desc">按原厂手册绘制445×215×118 mm激光头。侧调节件外伸56.5 mm，六个Ø6.4安装孔；侧四孔50×225 mm孔距参与吸附，前端两孔仅示意。左端399主光口、798监视口分开标识，光口横向位置及高度待实测，十字不代表已定标。局部接头、脚边及孔组绝对原点为估读，不用于加工。</desc>
