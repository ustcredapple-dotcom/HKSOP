<svg xmlns="http://www.w3.org/2000/svg" viewBox="-248 -174 482 348" width="482mm" height="348mm" role="img" aria-labelledby="laser532-title laser532-desc">
  <title id="laser532-title">532 nm 激光器 · 频准激光 · 俯视图</title>
  <desc id="laser532-desc">激光头主壳长400 mm，含支脚占位419×322 mm，后接头另计。六个直径6.4 mm通孔：每组两孔间距50 mm，上下孔排距310 mm。绿色标记为左端光口，距总宽上侧外缘60 mm，光轴距支承底面95.7 mm。主壳宽约300 mm及后接头、接缝为照片估读示意；不用于加工，不含独立控制机箱。</desc>
  <defs>
    <linearGradient id="laser532-lid" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4f6f8"/><stop offset="1" stop-color="#cdd5df"/></linearGradient>
    <linearGradient id="laser532-foot" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a4afbd"/><stop offset=".5" stop-color="#e7ebef"/><stop offset="1" stop-color="#a4afbd"/></linearGradient>
    <g id="laser532-screw"><circle r="1.8" fill="#566170" stroke="#334155" stroke-width=".35"/><path d="M-1 0H1" stroke="#dce3ea" stroke-width=".55"/></g>
    <g id="laser532-hole"><circle r="3.2" fill="#fff" stroke="#334155" stroke-width=".65"/></g>
  </defs>
  <!-- Housing-centre datum; SVG Y is the negative of board-local Y. -->
