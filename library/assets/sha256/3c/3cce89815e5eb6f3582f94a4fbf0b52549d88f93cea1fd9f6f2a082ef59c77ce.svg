    <text x="16" y="2" font-size="10" letter-spacing="2.5" fill="#6b7987">PRECILASERS</text>
    <text x="16" y="29" font-size="9" fill="#547364">光轴高 95.7 mm</text>
    <text x="-18" y="124" font-size="7.5" fill="#73808f">6 × Ø6.4 · 含支脚 419 × 322 mm</text>
  </g>
  <g id="optical-output-port" data-optical-port="output" data-x-mm="-208" data-y-mm="101" data-height-mm="95.7" data-wavelength-nm="532" stroke="#299b36" fill="none">
