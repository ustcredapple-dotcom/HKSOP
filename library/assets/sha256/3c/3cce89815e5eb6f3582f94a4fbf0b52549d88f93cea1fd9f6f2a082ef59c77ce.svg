    <path d="M-236-106L-244-101L-236-96Z" fill="#299b36" stroke="none"/>
    <circle cx="-208" cy="-101" r="5" fill="#fff" stroke-width="1.5"/>
    <path d="M-216-101H-200M-208-109V-93" stroke-width=".9"/>
    <path d="M-187-161V-101M-190-161H-184M-190-101H-184M-202-101H-182" stroke-width=".65" stroke-dasharray="2 1.5"/>
  </g>
  <g font-family="Arial, 'PingFang SC', sans-serif" fill="#247d32">
    <text x="-178" y="-124" font-size="8">60 mm</text>
    <text x="-178" y="-99" font-size="10.5" font-weight="600">光口 / OUTPUT</text>
    <text x="-178" y="-83" font-size="8">532 nm · 向左出光</text>
  </g>
