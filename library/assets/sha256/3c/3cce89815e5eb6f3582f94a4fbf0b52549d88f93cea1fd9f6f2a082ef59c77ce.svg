    <path d="M198-26H211V36H198Z" fill="url(#laser532-foot)"/>
    <rect x="-200" y="-150" width="400" height="300" rx="1.2" fill="url(#laser532-lid)"/>
    <path d="M-199 70H-34V88H137V-2H199M137 88V149" fill="none" stroke="#57677a" stroke-width=".85"/>
    <path d="M-196-146H196M-196 146H133" stroke="#eaf0f5" stroke-width="1.3"/>
    <g id="laser532-service-connectors">
      <path d="M200-144H210V-124H200ZM210-140H221L224-136V-132L221-128H210Z" fill="#8896a7"/>
      <path d="M200 50H210V70H200ZM210 54H220L224 58V62L220 66H210ZM200 86H210V106H200ZM210 90H220L224 94V98L220 102H210Z" fill="#9eabba"/>
      <path d="M200 113H209V139H200ZM209 117H220V135H209Z" fill="#647286"/>
      <path d="M212-140V-128M214 54V66M214 90V102M212 118V134M215 118V134" fill="none" stroke="#435267" stroke-width=".65"/>
    </g>
  </g>
  <g id="laser532-mounting-holes" data-diameter-mm="6.4">
    <use href="#laser532-hole" x="-170" y="-155"/><use href="#laser532-hole" x="-120" y="-155"/>
    <use href="#laser532-hole" x="-170" y="155"/><use href="#laser532-hole" x="-120" y="155"/>
    <use href="#laser532-hole" x="205" y="30"/><use href="#laser532-hole" x="205" y="-20"/>
  </g>
  <g id="laser532-lid-fasteners">
    <use href="#laser532-screw" x="-194" y="-144"/><use href="#laser532-screw" x="-100" y="-146"/><use href="#laser532-screw" x="-50" y="-146"/><use href="#laser532-screw" x="0" y="-146"/><use href="#laser532-screw" x="50" y="-146"/><use href="#laser532-screw" x="100" y="-146"/><use href="#laser532-screw" x="150" y="-146"/><use href="#laser532-screw" x="194" y="-144"/>
    <use href="#laser532-screw" x="-196" y="-45"/><use href="#laser532-screw" x="-196" y="5"/><use href="#laser532-screw" x="196" y="-100"/><use href="#laser532-screw" x="196" y="-45"/><use href="#laser532-screw" x="196" y="146"/>
