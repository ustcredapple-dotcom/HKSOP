<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="ecdl-title ecdl-desc">
  <title id="ecdl-title">ECDL / CatEye 1030 nm 光学头 · 尺寸待补</title>
  <desc id="ecdl-desc">根据 CatEye 软件手册封面中独立光学头外观绘制的未定标元件库缩略图。图中不包含下方 CEL Driver 控制机箱。FC/APC 为光纤输出，不代表自由空间出光轴。所有图形坐标均为屏幕示意坐标，不是毫米；未给定壳体尺寸、安装孔或端口坐标，暂不可拖入有尺寸的布局画布。</desc>
  <defs>
    <linearGradient id="ecdl-lid" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#edf2f3"/><stop offset=".5" stop-color="#cbd5d8"/><stop offset="1" stop-color="#aebbc1"/></linearGradient>
    <linearGradient id="ecdl-port" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3e474b"/><stop offset=".4" stop-color="#c5cdd0"/><stop offset=".65" stop-color="#f2f5f5"/><stop offset="1" stop-color="#707d83"/></linearGradient>
  </defs>
  <g font-family="STHeiti, PingFang SC, sans-serif" text-anchor="middle">
    <text x="210" y="31" font-size="18" font-weight="600" fill="#203b39">ECDL / CatEye · 1030 nm</text>
    <text x="210" y="52" font-size="12" fill="#5d7470">独立光学头 · 外观示意</text>
    <g stroke="#56666d" stroke-width="1.5" stroke-linejoin="round">
      <rect x="91" y="86" width="247" height="101" rx="6" fill="#000" opacity=".05" stroke="none"/>
      <rect x="85" y="80" width="247" height="101" rx="5" fill="url(#ecdl-lid)"/>
      <path d="M93 82V179M326 83V178" fill="none" stroke="#8a9ba3" stroke-width="1"/>
      <rect x="78" y="112" width="10" height="37" rx="2" fill="#79898f"/>
      <rect x="57" y="117" width="23" height="27" rx="2" fill="url(#ecdl-port)"/>
      <rect x="48" y="120" width="13" height="21" rx="3" fill="#374348"/>
      <path d="M51 122V139M55 122V139M65 119V142M72 118V143" stroke="#acb8bd" stroke-width=".8"/>
    </g>
    <text x="215" y="126" font-size="18" fill="#597078" letter-spacing="1">CatEye</text>
    <text x="215" y="148" font-size="11" fill="#5d727a">光学头</text>
    <path d="M54 151V190H81" fill="none" stroke="#748786" stroke-width="1.2"/>
    <text x="104" y="205" font-size="12" fill="#486664">FC/APC 光纤输出</text>
    <rect x="85" y="224" width="250" height="35" rx="8" fill="#fff6e7" stroke="#e3c791"/>
    <text x="210" y="247" font-size="15" font-weight="600" fill="#8a601f">尺寸待补 · 暂不可放入画布</text>
  </g>
</svg>
