<svg xmlns="http://www.w3.org/2000/svg" viewBox="-270 -100 520 200" width="520mm" height="200mm" role="img" aria-labelledby="laser556-title laser556-desc">
  <title id="laser556-title">556 nm 激光器 · 频准激光 · 校准俯视图</title>
  <desc id="laser556-desc">FL-SF-556-1.5-CW倍频输出腔，主壳375×90×73 mm。绿色光口位于图中右端，向右出光，光轴距支承底面37 mm；正看出光端面，光轴距右侧主壳边44 mm，对应本图中心上侧1 mm。左端是连接线，不是出光口。侧散热器、接头、可调夹脚与滑槽按同页正交图比例估读；安装孔径、定位和调整范围未标注，不作孔吸附依据。不含独立放大控制箱和1112 nm监视口。不用于加工。</desc>
