    <linearGradient id="laser556-cable" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eceff1"/><stop offset=".48" stop-color="#f8fafb"/><stop offset="1" stop-color="#aeb9c2"/></linearGradient>
